services:
  springboot-app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: springboot-app
    ports:
      - "${APP_PORT:-8086}:${APP_PORT:-8086}"
    environment:
      # ESTA LÍNEA ES LA QUE TE FALTABA:
      - APP_PORT=${APP_PORT:-8086} 
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      # PostgreSQL usa estos nombres específicos de variable para inicializarse
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: